# ── Build system
[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

# ── Package metadata
[project]
name = "krum"
version = "0.1.0"
description = "Byzantine-resilient aggregation rules for distributed machine learning."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sébastien Rouault", email = "sebastien.rouault@alumni.epfl.ch"},
    {name = "Arthur Danjou", email = "arthur.danjou@dauphine.eu"},
    {name = "Mohamad Ammar Said", email = "mohamad-ammar.said@polytechnique.edu"}
]
# See https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies (pulled by pip install krum)
dependencies = [
    "pandas>=2.2.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

# Extra dependencies for running experiments (pip install krum[experiments])
[project.optional-dependencies]
experiments = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "seaborn>=0.13.0",
]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-favicon>=1.0.1",
    "sphinx-togglebutton>=0.3.2",
    "sphinx-contributors>=0.3.0",
    "shibuya>=2026.7.12",
]

[project.urls]
Homepage = "https://github.com/calicarpa/krum"
Repository = "https://github.com/calicarpa/krum"
Issues = "https://github.com/calicarpa/krum/issues"

# ── Type checker (ty)
[tool.ty.rules]
invalid-method-override = "ignore"

[tool.ty.src]
include = ["krum", "tests"]

# ── Packaging
[tool.setuptools.packages.find]
where = ["."]
include = ["krum*"]

# Include C++ / CUDA headers and build artefacts in the native extension
[tool.setuptools.package-data]
"krum.native" = ["**/*.hpp", "**/*.cpp", "**/*.cu", "**/*.h", "**/*.deps", "**/.placeholder"]

# ── Linter & formatter (ruff)
[tool.ruff]
target-version = "py310"
line-length = 120
include = ["krum/**", "tests/**"]
exclude = [
    "repositories",
    ".venv",
    ".git",
    ".ruff_cache",
    "build",
    "dist",
]
# Apply safe fixes automatically
fix = true
show-fixes = true
# Opt into rules still under preview
preview = true

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes (unused imports, undefined names, etc.)
    "I",    # isort (import ordering)
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (common gotchas)
    "C4",   # flake8-comprehensions (suggest better comprehensions)
    "RET",  # flake8-return (simplify return statements)
    "D",    # pydocstyle (docstring conventions)
]
ignore = [
    "E402",  # module level import not at top of file (intentional in this codebase)
    "E501",  # line too long (handled by formatter)
    "UP031", # percent format (legacy codebase, too noisy to fix now)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Test & docs dependencies (PEP 735 dependency groups)
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "sphinx-autobuild>=2024.10.3",
]
